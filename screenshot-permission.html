<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enable Windchill Screenshot Access</title>
    <style>
      :root {
        --bg: #f5f9fd;
        --card: #ffffff;
        --text: #173047;
        --muted: #587286;
        --border: #dbe7f1;
        --accent: #0e6f61;
        --accent2: #1b5e9e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f7fbff 0%, #edf4f9 100%);
        color: var(--text);
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 20px;
      }
      .card {
        max-width: 560px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 28px;
        box-shadow: 0 18px 50px rgba(13, 38, 59, 0.06);
      }
      h1 { margin: 0 0 12px; font-size: 1.8rem; line-height: 1.1; }
      p { margin: 0 0 14px; }
      .muted { color: var(--muted); }
      button {
        padding: 12px 18px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, var(--accent2) 0%, var(--accent) 100%);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }
      .status {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 14px;
        background: #eef6fb;
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Enable Screenshot Access</h1>
      <p>
        Windchill PowerTools needs temporary Chrome screenshot permission to capture the current Windchill page.
      </p>
      <p class="muted">
        Click the button below, approve the Chrome permission prompt, then return to Windchill and click Screenshot again.
      </p>
      <button id="grant-button">Grant Screenshot Permission</button>
      <div class="status" id="status">Waiting for permission.</div>
    </div>
    <script src="screenshot-permission.js"></script>
  </body>
  </html>
